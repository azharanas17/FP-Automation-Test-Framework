name: Automation Test Framework CI

on:
  workflow_dispatch:
  push: 
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run API Tests
        run: ./gradlew runApiTests

      - name: Upload API Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: |
            app/build/reports/cucumber/api-cucumber.html
            app/build/reports/cucumber/api-cucumber.json

  run-web-tests:
    name: Run Web UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Web UI Tests
        run: ./gradlew runWebTests

      - name: Upload Web Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-report
          path: |
            app/build/reports/cucumber/web-cucumber.html
            app/build/reports/cucumber/web-cucumber.json

  deploy-reports:
    name: Deploy Reports to GitHub Pages
    needs: [run-api-tests, run-web-tests]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download API test report
        uses: actions/download-artifact@v4
        with:
          name: api-test-report
          path: reports

      - name: Download Web test report
        uses: actions/download-artifact@v4
        with:
          name: web-test-report
          path: reports

      - name: Copy reports to correct paths
        run: |
          mkdir -p pages
          cp reports/api-cucumber.html pages/
          cp reports/api-cucumber.json pages/
          cp reports/web-cucumber.html pages/
          cp reports/web-cucumber.json pages/

      - name: Create index.html landing page
        run: |
          cat > pages/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Test Reports - Automation Test Framework</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: #0f172a;
                      color: #e2e8f0;
                      min-height: 100vh;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                  }
                  .container { text-align: center; padding: 2rem; }
                  h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #f8fafc; }
                  .subtitle { color: #94a3b8; margin-bottom: 3rem; font-size: 1rem; }
                  .cards { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; }
                  .card {
                      background: #1e293b; border: 1px solid #334155;
                      border-radius: 12px; padding: 2.5rem 2rem; width: 280px;
                      text-decoration: none; color: inherit; transition: all 0.2s ease;
                  }
                  .card:hover {
                      border-color: #3b82f6; transform: translateY(-4px);
                      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.15);
                  }
                  .card-icon { font-size: 2.5rem; margin-bottom: 1rem; }
                  .card h2 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #f1f5f9; }
                  .card p { color: #94a3b8; font-size: 0.875rem; line-height: 1.5; }
                  .badge {
                      display: inline-block; margin-top: 1rem; padding: 0.25rem 0.75rem;
                      border-radius: 9999px; font-size: 0.75rem; font-weight: 600;
                  }
                  .badge-api { background: #1e3a5f; color: #60a5fa; }
                  .badge-web { background: #1a3a2a; color: #4ade80; }
                  .footer { margin-top: 3rem; color: #475569; font-size: 0.8rem; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Automation Test Reports</h1>
                  <p class="subtitle">Cucumber BDD Test Results</p>
                  <div class="cards">
                      <a href="api-cucumber.html" class="card">
                          <div class="card-icon">&#128269;</div>
                          <h2>API Tests</h2>
                          <p>DummyAPI user CRUD operations, tag retrieval, and error handling</p>
                          <span class="badge badge-api">@api</span>
                      </a>
                      <a href="web-cucumber.html" class="card">
                          <div class="card-icon">&#128187;</div>
                          <h2>Web UI Tests</h2>
                          <p>Demoblaze login, product browsing, cart & checkout flow</p>
                          <span class="badge badge-web">@web</span>
                      </a>
                  </div>
                  <p class="footer">Generated by Cucumber | Automation Test Framework</p>
              </div>
          </body>
          </html>
          HTMLEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
