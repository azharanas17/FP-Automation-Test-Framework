plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.15.0'
    testImplementation 'io.cucumber:cucumber-junit:7.15.0'

    // Selenium WebDriver
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.27.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.2'

    // REST Assured for API testing
    testImplementation 'io.rest-assured:rest-assured:5.4.0'

    // JUnit
    testImplementation 'junit:junit:4.13.2'

    // JSON processing
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

test {
    useJUnit()

    systemProperty('cucumber.plugin', 'pretty, html:build/reports/cucumber/cucumber.html, json:build/reports/cucumber/cucumber.json')
    systemProperty('cucumber.glue', 'com.automation')
    systemProperty('cucumber.features', 'src/test/resources/features')

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

tasks.register('runWebTests', Test) {
    description = 'Runs all Cucumber tests tagged with @web'
    group = 'verification'
    useJUnit()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/WebTestRunner.class'

    systemProperty('cucumber.filter.tags', '@web')
    systemProperty('cucumber.plugin', 'pretty, html:build/reports/cucumber/web-cucumber.html, json:build/reports/cucumber/web-cucumber.json')
    systemProperty('cucumber.glue', 'com.automation.web.stepdefinitions')
    systemProperty('cucumber.features', 'src/test/resources/features/web')

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

tasks.register('runApiTests', Test) {
    description = 'Runs all Cucumber tests tagged with @api'
    group = 'verification'
    useJUnit()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/ApiTestRunner.class'

    systemProperty('cucumber.filter.tags', '@api')
    systemProperty('cucumber.plugin', 'pretty, html:build/reports/cucumber/api-cucumber.html, json:build/reports/cucumber/api-cucumber.json')
    systemProperty('cucumber.glue', 'com.automation.api.stepdefinitions')
    systemProperty('cucumber.features', 'src/test/resources/features/api')

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}
